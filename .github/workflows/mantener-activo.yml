# Birria Express · Mantiene activo el proyecto de Supabase
# Supabase pausa los proyectos gratis que pasan 7 días sin uso.
# Esto hace una consulta pequeña al menú una vez al día para que eso no pase.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 14 * * *"   # todos los días a las 8:17 a. m. hora de Costa Rica
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el menú
        run: |
          curl -sS --fail -o /dev/null -w "Supabase respondió: %{http_code}\n" \
            "https://iavhpdpmsonysqcsjdtx.supabase.co/rest/v1/productos?select=id&limit=1" \
            -H "apikey: sb_publishable_UYeU2l3q8zN0XVXr3Q5yMQ_sTsVKUxA"
